name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"

          awk -v tag="$TAG_NAME" -v version="$VERSION" '
            BEGIN { found=0 }
            /^##[[:space:]]+/ {
              if (found == 1) {
                exit
              }

              heading=$0
              gsub(/^##[[:space:]]+/, "", heading)
              gsub(/[[:space:]]+$/, "", heading)

              if (heading == tag || heading == version || heading == "[" tag "]" || heading == "[" version "]") {
                found=1
                next
              }
            }
            found == 1 {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            cat > release-notes.md <<EOF
          Maintenance Dashboard ${TAG_NAME}

          See the full changelog in CHANGELOG.md.
          EOF
          fi

          echo "release_notes=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          fi
