name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest

    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  build:
    name: Build and Python check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Snapshot committed build artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp custom_components/maintenance_dashboard/www/maintenance-dashboard-panel.js "$RUNNER_TEMP/committed/panel.js"
          cp custom_components/maintenance_dashboard/i18n_generated.py "$RUNNER_TEMP/committed/i18n_generated.py"

      - name: Build frontend
        run: npm run build

      - name: Verify committed build artifacts are current
        run: |
          set -eu
          status=0
          check() {
            if ! diff -u "$RUNNER_TEMP/committed/$1" "$2" > "$RUNNER_TEMP/$1.diff"; then
              echo "::error file=$2::Committed artifact is out of date. Run npm ci && npm run build and commit the result."
              head -n 80 "$RUNNER_TEMP/$1.diff"
              status=1
            fi
          }
          check panel.js custom_components/maintenance_dashboard/www/maintenance-dashboard-panel.js
          check i18n_generated.py custom_components/maintenance_dashboard/i18n_generated.py
          exit "$status"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Compile Python files
        run: python -m compileall custom_components/maintenance_dashboard
