name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest

    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  build:
    name: Build and Python check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify compiled frontend is committed
        run: |
          if ! git diff --quiet -- custom_components/maintenance_dashboard/www/maintenance-dashboard-panel.js; then
            echo "::error::Compiled frontend is out of date."
            git diff -- custom_components/maintenance_dashboard/www/maintenance-dashboard-panel.js | head -n 160
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Compile Python files
        run: python -m compileall custom_components/maintenance_dashboard
