mark_done:
  name: Mark maintenance task done
  description: Mark a maintenance task as completed and persist a history snapshot.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    done_at:
      name: Done at
      required: false
      selector:
        datetime:
    note:
      name: Completion note
      required: false
      selector:
        text:
    material:
      name: Material or parts
      required: false
      selector:
        text:
    cost:
      name: Cost
      required: false
      selector:
        number:
          min: 0
          mode: box
    currency:
      name: Currency
      required: false
      default: EUR
      selector:
        select:
          options:
            - EUR
            - USD
            - GBP
            - CHF
    performed_by:
      name: Performed by
      required: false
      selector:
        text:

reactivate_task:
  name: Reactivate one-time task
  description: Reactivate a previously completed one-time maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:

snooze:
  name: Snooze maintenance task
  description: Snooze a maintenance task for a number of days.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    days:
      name: Days
      required: true
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box

clear_snooze:
  name: Clear maintenance task snooze
  description: Remove the snooze state from a maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:

restore_backup:
  name: Restore backup
  description: Restore a stored maintenance dashboard backup snapshot.
  fields:
    backup_id:
      name: Backup ID
      required: true
      selector:
        text:

test_notification:
  name: Test notification
  description: Send a test notification using the configured or provided notify service.
  fields:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:

send_digest:
  name: Send maintenance digest
  description: Send a digest notification with current maintenance status.
  fields:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:
    include_ok:
      name: Include OK tasks
      required: false
      default: false
      selector:
        boolean:
    include_snoozed:
      name: Include snoozed tasks
      required: false
      default: false
      selector:
        boolean:

notify_task:
  name: Notify maintenance task
  description: Send a notification for a specific maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:

notify_due_tasks:
  name: Notify due maintenance tasks
  description: Send notifications for due, warning, critical or overdue tasks.
  fields:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:
    statuses:
      name: Statuses
      required: false
      selector:
        select:
          multiple: true
          options:
            - warning
            - critical
            - overdue
            - unavailable

process_notifications:
  name: Process maintenance notifications
  description: Evaluate notification rules immediately, including repeats and escalations.

cleanup_task_entities:
  name: Clean up task entities
  description: Remove orphaned per-task entities from the Home Assistant entity registry.

clear_notification_history:
  name: Clear notification history
  description: Remove retained notification delivery history without resetting deduplication records.

create_backup:
  name: Create maintenance backup
  description: Create a named backup of tasks, history, settings, notification state, quarantine and audit data.
  fields:
    name:
      name: Backup name
      required: false
      selector:
        text:
    pinned:
      name: Pin backup
      required: false
      default: false
      selector:
        boolean:

restore_backup_sections:
  name: Restore backup sections
  description: Restore selected data sections or selected tasks from a backup after creating a safety backup.
  fields:
    backup_id:
      name: Backup ID
      required: true
      selector:
        text:
    sections:
      name: Sections
      required: false
      selector:
        select:
          multiple: true
          options:
            - tasks
            - history
            - settings
            - notification_state
            - quarantine
            - audit
    task_ids:
      name: Selected task IDs
      required: false
      selector:
        text:
          multiple: true

check_integrity:
  name: Check data integrity
  description: Validate tasks, history, backups, settings and notification state without modifying data.

repair_integrity:
  name: Repair data integrity
  description: Create a safety backup and repair all non-destructively repairable integrity issues.

bulk_operation:
  name: Run bulk task operation
  description: Execute a single backed-up operation on multiple maintenance tasks.
  fields:
    task_ids:
      name: Task IDs
      required: true
      selector:
        text:
          multiple: true
    action:
      name: Action
      required: true
      selector:
        select:
          options:
            - done
            - snooze
            - category
            - area
            - priority
            - enable
            - disable
            - delete
    value:
      name: Action value
      required: false
      selector:
        object:
