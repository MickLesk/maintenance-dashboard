mark_done:
  name: Mark maintenance task done
  description: Mark a maintenance task as completed and persist a history snapshot.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    done_at:
      name: Done at
      required: false
      selector:
        datetime:
    note:
      name: Completion note
      required: false
      selector:
        text:

snooze:
  name: Snooze maintenance task
  description: Snooze a maintenance task for a number of days.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    days:
      name: Days
      required: true
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box

clear_snooze:
  name: Clear maintenance task snooze
  description: Remove the snooze state from a maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:

restore_backup:
  name: Restore backup
  description: Restore a stored maintenance dashboard backup snapshot.
  fields:
    backup_id:
      name: Backup ID
      required: true
      selector:
        text:

test_notification:
  name: Test notification
  description: Send a test notification using the configured or provided notify service.
  fields:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:

send_digest:
  name: Send maintenance digest
  description: Send a digest notification with current maintenance status.
  fields:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:
    include_ok:
      name: Include OK tasks
      required: false
      default: false
      selector:
        boolean:
    include_snoozed:
      name: Include snoozed tasks
      required: false
      default: false
      selector:
        boolean:

notify_task:
  name: Notify maintenance task
  description: Send a notification for a specific maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:

notify_due_tasks:
  name: Notify due maintenance tasks
  description: Send notifications for due, warning, critical or overdue tasks.
  fields:
    notify_service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:
    statuses:
      name: Statuses
      required: false
      selector:
        select:
          multiple: true
          options:
            - warning
            - critical
            - overdue
            - unavailable
