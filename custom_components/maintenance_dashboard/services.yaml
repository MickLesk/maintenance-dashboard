mark_done:
  name: Mark maintenance task done
  description: Mark a maintenance task as completed and persist a history snapshot.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    done_at:
      name: Done at
      required: false
      selector:
        datetime:

snooze:
  name: Snooze maintenance task
  description: Snooze a maintenance task for a number of days.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    days:
      name: Days
      required: true
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box

clear_snooze:
  name: Clear maintenance task snooze
  description: Remove the snooze state from a maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:

restore_backup:
  name: Restore backup
  description: Restore a stored maintenance dashboard backup snapshot.
  fields:
    backup_id:
      name: Backup ID
      required: true
      selector:
        text:

send_digest:
  name: Send maintenance digest
  description: Send a maintenance dashboard digest through a Home Assistant notification service.
  fields:
    service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:
    message:
      name: Message override
      required: false
      selector:
        text:

test_notification:
  name: Test notification
  description: Send a test notification for Maintenance Dashboard.
  fields:
    service:
      name: Notify service
      required: false
      example: notify.mobile_app_phone
      selector:
        text:
    message:
      name: Message
      required: false
      selector:
        text:
