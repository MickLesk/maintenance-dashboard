name: Renovate

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level"
        default: "info"
        required: false
        type: choice
        options:
          - debug
          - info
          - warn
          - error
      dry_run:
        description: "Dry run, do not create PRs"
        default: false
        required: false
        type: boolean

jobs:
  renovate:
    name: Renovate Dependency Updates
    runs-on: [self-hosted, linux, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate secrets
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "RENOVATE_TOKEN is missing or empty."
            exit 1
          fi

      - name: Run Renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://dev.saxhub.me
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_CONFIG_FILE: ${{ github.workspace }}/renovate.json
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == 'true' && 'full' || '' }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GH_COM_TOKEN }}
        run: npx --yes renovate
